server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: score-mall-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/score_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: score-mall-jwt-secret-key-2026-very-long-and-secure
  # App端 token 有效期 7天
  app-expiration: 604800000
  # 后管 token 有效期 24小时
  admin-expiration: 86400000

# 文件上传 (本地存储)
upload:
  path: ${UPLOAD_PATH:./uploads}
  url-prefix: /uploads

logging:
  level:
    com.score.mall: debug
    org.springframework: warn
